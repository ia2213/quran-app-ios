name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - profile

jobs:
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
          cache-key: flutter-ios-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
      
      - name: Get Flutter dependencies
        run: flutter pub get
        working-directory: .
      
      - name: Verify Flutter
        run: |
          flutter doctor -v
          flutter --version
      
      - name: Configure iOS signing (for simulator build)
        run: |
          # For simulator builds, we don't need provisioning profiles
          # Just ensure the project is configured correctly
          xcodebuild -version
          xcodebuild -showsdks
      
      - name: Build iOS app (simulator)
        run: |
          flutter build ios --debug --simulator --no-codesign
        working-directory: .
      
      - name: Build iOS app (device) - optional, requires signing
        if: github.event.inputs.build_type != 'debug'
        run: |
          # This will fail without proper signing certs
          # flutter build ios --release --no-codesign
          echo "Device build requires Apple Developer account and certificates"
      
      - name: Package iOS app for simulator
        if: always()
        run: |
          # Find the built app
          APP_PATH=$(find build/ios/iphonesimulator -name "*.app" | head -1)
          if [ -n "$APP_PATH" ]; then
            echo "Found app at: $APP_PATH"
            # Create a zip for download
            cd "$(dirname "$APP_PATH")"
            zip -r "${{ github.workspace }}/quran-app-ios-simulator.zip" "$(basename "$APP_PATH")"
            echo "Created simulator zip"
          else
            echo "No .app found for simulator"
            find build/ios -name "*.app" 2>/dev/null
          fi
      
      - name: Upload iOS simulator build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-ios-simulator
          path: quran-app-ios-simulator.zip
          retention-days: 7
      
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            **/build/ios/**/*.log
          retention-days: 7