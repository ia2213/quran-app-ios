name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      altstore_url:
        description: 'AltStore API URL (optional)'
        required: false
        default: ''

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true
      
      - name: Flutter doctor
        run: flutter doctor -v
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build iOS (no codesign for sideloading)
        run: flutter build ios --release --no-codesign
      
      - name: Package IPA
        run: |
          echo "=== Packaging IPA ==="
          
          # Find the .app bundle
          APP_DIR=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app found in build/ios/iphoneos"
            find build/ios -name "*.app" 2>/dev/null
            exit 1
          fi
          
          echo "Found app: $APP_DIR"
          APP_NAME=$(basename "$APP_DIR")
          
          # Create IPA structure
          mkdir -p Payload
          cp -r "$APP_DIR" Payload/
          
          # Create IPA (zip)
          zip -r -y quran-app.ipa Payload
          rm -rf Payload
          
          echo "IPA created:"
          ls -lh quran-app.ipa
          
          # Verify
          unzip -l quran-app.ipa | head -5
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-ios
          path: quran-app.ipa
          retention-days: 30
          if-no-files-found: error
      
      - name: Print AltStore install instructions
        run: |
          echo "## 📱 AltStore Installation Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Option 1: AltServer (Recommended)" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA from the Artifacts section above" >> $GITHUB_STEP_SUMMARY
          echo "2. Open AltStore on your iPhone" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect iPhone to Mac/PC" >> $GITHUB_STEP_SUMMARY
          echo "4. In AltStore, tap '+' → select the IPA file" >> $GITHUB_STEP_SUMMARY
          echo "5. Sign with your Apple ID (free account works)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Option 2: Sideloadly" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA" >> $GITHUB_STEP_SUMMARY
          echo "2. Open Sideloadly" >> $GITHUB_STEP_SUMMARY
          echo "3. Connect iPhone → drag IPA into Sideloadly" >> $GITHUB_STEP_SUMMARY
          echo "4. Click Start to install" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Option 3: AltStore via iCloud" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA from Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "2. Open AltStore on iPhone" >> $GITHUB_STEP_SUMMARY
          echo "3. My Apps → + → Import File → select IPA" >> $GITHUB_STEP_SUMMARY
