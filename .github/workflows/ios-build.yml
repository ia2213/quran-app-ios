name: iOS Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Device IPA
    runs-on: macos-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true
      
      - name: Get dependencies
        run: flutter pub get
      
      - name: Build iOS project info
        run: |
          flutter doctor -v
          echo "Flutter version: $(flutter --version | head -1)"
      
      - name: Build iOS release (no codesign for sideloading)
        run: |
          # Build for release but skip code signing (for sideloading via AltStore/SideStore)
          flutter build ios --release --no-codesign
          echo "Build complete"
      
      - name: Create IPA from built app
        run: |
          # Find the .app built
          APP_DIR=$(find build/ios/release -name "*.app" -type d | head -1)
          echo "Found app: $APP_DIR"
          
          if [ -n "$APP_DIR" ]; then
            # Create Payload directory and copy .app into it
            mkdir -p Payload
            cp -r "$(basename "$APP_DIR")" Payload/
            
            # Zip it to create IPA
            zip -r quran-app-ios.ipa Payload
            rm -rf Payload
            
            echo "Created IPA: $(pwd)/quran-app-ios.ipa"
            ls -lh quran-app-ios.ipa
          else
            echo "ERROR: No .app found in build/ios/release"
            find build/ios -name "*.app" 2>/dev/null | head -5
            exit 1
          fi
      
      - name: Verify IPA
        run: |
          if [ -f "quran-app-ios.ipa" ]; then
            echo "IPA exists: $(ls -lh quran-app-ios.ipa)"
            # Check it's a valid zip
            if file quran-app-ios.ipa | grep -q "ZIP"; then
              echo "IPA is a valid ZIP file"
            fi
          else
            echo "ERROR: IPA was not created"
            exit 1
          fi
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-app-ios-ipa
          path: quran-app-ios.ipa
          retention-days: 30
          if-no-files-found: error
      
      - name: Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: Quran App (iOS)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build type**: Release (no codesign)" >> $GITHUB_STEP_SUMMARY
          echo "- **Install method**: AltStore / SideStore / Sideloadly" >> $GITHUB_STEP_SUMMARY
          echo "- **Apple ID required**: Your free personal Apple ID" >> $GITHUB_STEP_SUMMARY
